# render.yaml

services:
  - type: web   # or private/background if you don’t need a public HTTP endpoint
    name: besu-node-1
    env: docker
    dockerfilePath: Dockerfile
    buildCommand: ""    # let Render use default `docker build .`
    startCommand: >
      besu \
        --data-path=/besu/Node-1/data \
        --genesis-file=/besu/genesis.json \
        --config-file=/besu/qbftConfigFile.json \
        --rpc-http-enabled --rpc-http-api=ETH,NET,QBFT,WEB3 \
        --host-allowlist="*" \
        --rpc-http-cors-origins="all" \
        --p2p-port=30303 \
        --rpc-http-port=8545 \
        --metrics-enabled --metrics-host=0.0.0.0 --metrics-port=9545 \
        --version-compatibility-protection=false
    plan: free       # pick a plan that has enough CPU/RAM
    region: iad      # or your preferred region

  - type: web
    name: besu-node-2
    env: docker
    dockerfilePath: Dockerfile
    startCommand: >
      besu \
        --data-path=/besu/Node-2/data \
        --genesis-file=/besu/genesis.json \
        --config-file=/besu/qbftConfigFile.json \
        --bootnodes=enode://<NODE1_ENODE>@besu-node-1.internal:30303 \
        --p2p-port=30304 \
        --rpc-http-enabled --rpc-http-api=ETH,NET,QBFT,WEB3 \
        --host-allowlist="*" \
        --rpc-http-cors-origins="all" \
        --rpc-http-port=8546 \
        --metrics-enabled --metrics-host=0.0.0.0 --metrics-port=9546 \
        --version-compatibility-protection=false
    dependsOn:
      - besu-node-1
    plan: free
    region: iad

  - type: web
    name: besu-node-3
    env: docker
    dockerfilePath: Dockerfile
    startCommand: >
      besu \
        --data-path=/besu/Node-3/data \
        --genesis-file=/besu/genesis.json \
        --config-file=/besu/qbftConfigFile.json \
        --bootnodes=enode://<NODE1_ENODE>@besu-node-1.internal:30303 \
        --p2p-port=30305 \
        --rpc-http-enabled --rpc-http-api=ETH,NET,QBFT,WEB3 \
        --host-allowlist="*" \
        --rpc-http-cors-origins="all" \
        --rpc-http-port=8547 \
        --metrics-enabled --metrics-host=0.0.0.0 --metrics-port=9547 \
        --version-compatibility-protection=false
    dependsOn:
      - besu-node-1
    plan: free
    region: iad

  - type: web
    name: besu-node-4
    env: docker
    dockerfilePath: Dockerfile
    startCommand: >
      besu \
        --data-path=/besu/Node-4/data \
        --genesis-file=/besu/genesis.json \
        --config-file=/besu/qbftConfigFile.json \
        --bootnodes=enode://<NODE1_ENODE>@besu-node-1.internal:30303 \
        --p2p-port=30306 \
        --rpc-http-enabled --rpc-http-api=ETH,NET,QBFT,WEB3 \
        --host-allowlist="*" \
        --rpc-http-cors-origins="all" \
        --rpc-http-port=8548 \
        --metrics-enabled --metrics-host=0.0.0.0 --metrics-port=9548 \
        --version-compatibility-protection=false
    dependsOn:
      - besu-node-1
    plan: free
    region: iad

# (Optional) You can also define Environment entries here,
# or set them via the Render Dashboard.
