services:
  - type: web
    name: besu-node-1
    env: docker
    plan: standard  # "starter" does not support custom ports like 30303
    region: iad
    dockerfilePath: Dockerfile
    ports:
      - port: 8545   # expose this even if using $PORT — Render maps it
        protocol: tcp
      - port: 30303  # required for P2P discovery/communication
        protocol: tcp
      - port: 9545   # optional: metrics
        protocol: tcp
    startCommand: >
      besu \
        --data-path=/besu/Node-1/data \
        --genesis-file=/besu/genesis.json \
        --rpc-http-enabled --rpc-http-api=ETH,NET,QBFT,WEB3 \
        --host-allowlist="*" --rpc-http-cors-origins="all" \
        --p2p-port=30303 --rpc-http-port=8545 \
        --profile=ENTERPRISE --min-gas-price=1000 \
        --version-compatibility-protection=false \
        --metrics-enabled --metrics-host=0.0.0.0 --metrics-port=9545 \
        --nat-method=STATIC \
        --p2p-host=vel-ae7u.onrender.com

